name: Validate FinTrack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack_ci
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: fintrack_integrity_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fintrack_ci -d fintrack_integrity_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://fintrack_ci:isolated_ci_password@127.0.0.1:5432/fintrack_integrity_test_ci?schema=public
      DIRECT_URL: postgresql://fintrack_ci:isolated_ci_password@127.0.0.1:5432/fintrack_integrity_test_ci?schema=public
      TEST_DATABASE_URL: postgresql://fintrack_ci:isolated_ci_password@127.0.0.1:5432/fintrack_integrity_test_ci?schema=public
      JWT_SECRET: isolated-ci-test-secret-with-more-than-32-characters
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate && npx prisma validate && npx prisma migrate deploy
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
